# MeshHeal Helm values.

image:
  repository: meshheal-controlplane
  tag: "0.7.1"
  pullPolicy: IfNotPresent

# shadow (default): the controller only reads. The Role it gets has NO write permission at all.
# act:              the controller may update VirtualServices (one catch-all route's weights + its state annotation).
#                   Only switch this on after the playbook has been read and its reroutes set to confirmed: true.
mode: shadow

# REQUIRED. The namespace of the mesh application to watch. The Role is created there, not cluster-wide.
targetNamespace: ""

prometheusUrl: http://prometheus.istio-system.svc:9090
intervalSeconds: 15

# Extra controller settings (see meshheal_controlplane/meshheal.example.yaml), e.g.
#   act_threshold: 0.85
#   max_actions_per_hour: 6
#   max_reroute_s: 3600
#   control_configmap: meshheal-control
settings: {}

# The playbook. Draft one with: python -m controlplane.playbook_gen --namespace <ns> --out playbook.yaml
# and pass it with:  helm install ... --set-file playbook=playbook.yaml
# An empty playbook means the controller can score and log but has nothing it is allowed to do.
playbook: |
  reroutes: []
  depends: {}

# OPTIONAL learned baseline (Phase 4). Empty = the hand-set rule scorer (the default).
# Learn one on fault-free traffic: python -m controlplane.learn_baseline --snapshots normal.jsonl --out baseline.yaml
# then:  helm upgrade ... --set-file baseline=baseline.yaml
# Measured on real data (topo/results/phase4_*): better than the hand-set rule on both Bookinfo and Online Boutique,
# but on Boutique it still false-alarmed on 10.5% of normal snapshots. Run it in shadow mode first.
baseline: ""
# Which scorer uses that baseline: "baseline" (per service) or "edge" (per edge; also sees error faults). Empty = "baseline"
# when a baseline is given, else the hand-set rule. Results for both: REPORT_PHASE4.md.
scorer: ""

# Prometheus alert rules for the controller itself (stalled loop, errors, frequent or long reroutes, failed writes).
# With the Prometheus Operator installed they are created as a PrometheusRule; otherwise as a ConfigMap holding a
# rules file you add to Prometheus' rule_files (see docs/OPERATIONS.md).
alerts:
  enabled: true
  labels: {}               # extra labels for the PrometheusRule (e.g. the release label your operator selects on)

# OPTIONAL: push this cluster's snapshots and decisions to a fleet API (Phase 6). Needs an ingest token for `cluster`:
#   python -m dashboard.tokens --file tokens.json add-ingest <cluster>   (prints the token once)
#   kubectl create secret generic <name> --from-literal=token=<token> -n <release namespace>
fleet:
  url: ""                  # e.g. http://meshheal-fleet.meshheal-system.svc:8780 ; empty = no agent
  cluster: ""              # the name shown in the fleet; default: targetNamespace
  tokenSecret: ""          # Secret with key "token"

metricsPort: 9102

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 192Mi

# size limit of the scratch volume holding the snapshot file and the audit log (both rotate at 50 MB)
dataVolumeSizeLimit: 200Mi
