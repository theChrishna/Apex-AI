{{- if .Values.alerts.enabled }}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PrometheusRule" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "meshheal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meshheal.labels" . | nindent 4 }}
    {{- with .Values.alerts.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "meshheal.alertRules" . | nindent 2 }}
{{- else }}
# No Prometheus Operator here: the rules are a file. Add it to Prometheus' rule_files (docs/OPERATIONS.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "meshheal.fullname" . }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meshheal.labels" . | nindent 4 }}
data:
  meshheal-rules.yaml: |
    {{- include "meshheal.alertRules" . | nindent 4 }}
{{- end }}
{{- end }}
