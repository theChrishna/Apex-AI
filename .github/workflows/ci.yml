name: CI
on:
  push:
  pull_request:
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (CPU torch first, then the rest)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Control-plane tests
        working-directory: meshheal_controlplane
        run: python -m pytest -q
      - name: Dataset v3 tests
        run: python -m pytest -q test_build_dataset_v3.py
      - name: Phase 3 tests (topology builder, simulator, evaluation harness)
        run: python -m pytest -q topo/tests
  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [Frontend, Frontend_v2, Frontend_v3]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (only Frontend has any)
        if: matrix.dir == 'Frontend'
        run: npm test
      - run: npm run build
