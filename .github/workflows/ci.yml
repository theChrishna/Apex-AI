name: CI
on:
  push:
  pull_request:
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (CPU torch first, then the rest)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Control-plane tests
        working-directory: meshheal_controlplane
        run: python -m pytest -q
      - name: Dataset v3 tests
        run: python -m pytest -q test_build_dataset_v3.py
      - name: Phase 3 tests (topology builder, simulator, evaluation harness)
        run: python -m pytest -q topo/tests
      - name: Fleet API tests (auth, storage, agent, any mesh)
        run: python -m pytest -q dashboard/tests
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image (not pushed)
        run: docker build -f deploy/Dockerfile -t meshheal-controlplane:ci .
      - name: Image runs as non-root and needs no torch
        run: |
          docker run --rm meshheal-controlplane:ci controlplane.run --help | grep -e '--act'
          test "$(docker run --rm --entrypoint id meshheal-controlplane:ci -u)" = "10001"
          docker run --rm --entrypoint python meshheal-controlplane:ci -c "import sys, controlplane.run, controlplane.collect, controlplane.learn_baseline; assert 'torch' not in sys.modules"
      - name: Build the fleet image (API + dashboard; not pushed)
        run: |
          docker build -f deploy/Dockerfile.fleet -t meshheal-fleet:ci .
          test "$(docker run --rm --entrypoint id meshheal-fleet:ci -u)" = "10001"
          docker run --rm --entrypoint sh meshheal-fleet:ci -c "test -f /app/static/index.html"
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: Lint and render the Helm chart
        run: |
          helm lint deploy/helm/meshheal --set targetNamespace=demo
          helm template t deploy/helm/meshheal --set targetNamespace=demo > shadow.yaml
          helm template t deploy/helm/meshheal --set targetNamespace=demo --set mode=act > act.yaml
          if helm template t deploy/helm/meshheal > /dev/null 2>&1; then echo "targetNamespace must be required"; exit 1; fi
          if helm template t deploy/helm/meshheal --set targetNamespace=demo --set mode=oops > /dev/null 2>&1; then echo "mode must be validated"; exit 1; fi
          if grep -q '"update"' shadow.yaml; then echo "shadow mode must have no write verb"; exit 1; fi
          if grep -q -e '--act' shadow.yaml; then echo "shadow mode must not pass --act"; exit 1; fi
          grep -q '"update"' act.yaml
          grep -q -e '--act' act.yaml
          grep -q 'readOnlyRootFilesystem: true' shadow.yaml
          grep -q 'runAsNonRoot: true' shadow.yaml
          if grep -q -e '--scorer=baseline' shadow.yaml; then echo "baseline must be opt-in"; exit 1; fi
          printf 'floor_ms: 10\nservices:\n  a:\n    in_lat: {median: 5, high: 9}\n' > b.yaml
          helm template t deploy/helm/meshheal --set targetNamespace=demo --set-file baseline=b.yaml > base.yaml
          grep -q -e '--scorer=baseline' base.yaml
          grep -q 'baseline.yaml: |' base.yaml
          if grep -q 'dashboard.agent' shadow.yaml; then echo "the agent must be opt-in"; exit 1; fi
          helm template t deploy/helm/meshheal --set targetNamespace=demo --set fleet.url=http://f:8780 --set fleet.tokenSecret=s | grep -q 'dashboard.agent'
          if helm template t deploy/helm/meshheal --set targetNamespace=demo --set fleet.url=http://f:8780 > /dev/null 2>&1; then echo "fleet.tokenSecret must be required"; exit 1; fi
          helm lint deploy/helm/meshheal-fleet --set tokensSecret=s
          if helm template f deploy/helm/meshheal-fleet > /dev/null 2>&1; then echo "tokensSecret must be required"; exit 1; fi
          helm template f deploy/helm/meshheal-fleet --set tokensSecret=s --set-file baselines.demo=b.yaml | grep -q -e '--baseline=demo='
          helm template f deploy/helm/meshheal-fleet --set tokensSecret=s | grep -q 'automountServiceAccountToken: false'
  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [Frontend, Frontend_v2, Frontend_v3]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (Frontend and Frontend_v3)
        if: matrix.dir != 'Frontend_v2'
        run: npm test
      - run: npm run build
